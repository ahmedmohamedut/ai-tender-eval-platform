[project]
name = "tender-worker"
version = "0.1.0"
description = "AI Tender Evaluation Platform worker: one image, two roles (ingest, agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "nats-py==2.16.0",
    "aioboto3==15.5.0",
    "aiohttp==3.14.5",
    "pdfplumber>=0.11.10",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "langgraph==1.2.16",
    "langchain-openai==1.7.1",
    "langchain-core==1.6.10",
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-http==1.41.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "reportlab>=5.0.1",
    "ruff==0.17.0",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (real NATS and RustFS containers)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
