name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-development values only (see .env.example); no real secret exists in CI.
  COMPOSE_PROGRESS: plain

jobs:
  lint:
    name: lint (python, java, typescript, openapi, schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint everything
        run: make lint

  contracts:
    name: contracts (generation, schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint the spec, generate server interfaces and the typed client
        run: make api
      - name: Export message schemas and test the backend against them
        run: make contracts
      - name: Fail on schema drift
        run: |
          git diff --exit-code -- contracts || {
            echo "contracts/messages differs from a fresh export: run 'make contracts' and commit." >&2
            exit 1
          }
          test -z "$(git status --porcelain -- contracts)" || {
            git status --porcelain -- contracts
            echo "untracked or changed files under contracts/" >&2
            exit 1
          }

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: gradle/actions/setup-gradle@v6
      - run: make test-unit

  integration:
    name: integration tests (PostgreSQL, NATS, RustFS containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: gradle/actions/setup-gradle@v6
      - run: make test-integration

  images:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tender-eval/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: false
          tags: tender-eval/worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  slice:
    name: walking slice (whole environment)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc jq
      - name: Start the environment and run the slice
        run: |
          cp .env.example .env
          make test-slice
      - name: Environment checks
        run: make verify-env
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose/compose.yaml --profile apps logs --no-color --tail=200

  e2e:
    name: browser journeys (Phase 1 exit criterion)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc jq
      - name: Chromium
        run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Start the environment and run the journeys
        run: |
          cp .env.example .env
          make e2e
      - name: Traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose/compose.yaml --profile apps logs --no-color --tail=200

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
