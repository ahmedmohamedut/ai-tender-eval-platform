      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vendors:
    get:
      operationId: listVendors
      tags:
      - Vendors
      summary: List vendors
      x-roles:
      - admin
      x-ux:
      - UX-VND-03
      - PG-05
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createVendor
      tags:
      - Vendors
      summary: Create a vendor
      x-roles:
      - admin
      x-ux:
      - UX-VND-01
      - UX-VND-02
      description: A name or website that matches an existing vendor returns 409 duplicate_vendor with the matches,
        unless confirm_duplicate is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
          headers:
            ETag:
              description: The row_version as a strong ETag.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /vendors/duplicate-check:
    get:
      operationId: checkVendorDuplicates
