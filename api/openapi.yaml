openapi: 3.1.0
info:
  title: AI Tender Evaluation Platform API
  version: 1.0.0
  description: |
    REST API of the AI Tender Evaluation Platform. It serves the React single-page application and is the only way into the data.

    **Authentication.** Every call carries a Keycloak access token (`Authorization: Bearer`). Tokens are issued to the `tender-spa` client by the `tender-eval` realm with the authorization code flow and PKCE. The API validates the signature, issuer, audience `tender-api` and expiry, and reads `sub`, `email` and the `roles` claim. The Chair designation is not in the token: it comes from the tender membership.

    **Authorization.** Each operation lists the roles that may call it in `x-roles`. Who may see which rows is enforced again by the database (row-level security), so a role check alone never exposes another member's grades. An action that the caller can never take is hidden from `actions`; one that depends on state is returned with `allowed: false` and a one-line reason.

    **Errors.** `application/problem+json` (RFC 9457) with a stable `code`. 422 carries `errors` for fields and `failures` for pre-check lists. 403 for a tender the caller may not open carries `access_contacts`.

    **Concurrency.** Editable resources return an `ETag` that is their `row_version`. `PATCH` and `PUT` on them need `If-Match`. A stale value returns 412 with the current row and who changed it.

    **Notes.** Any action that overrides, deletes, rejects, reopens or reinstates takes a justification `note` or `reason`. Its minimum length is `client_config.min_note_length` from `GET /me`.

    **Long-running work.** Starting extraction, evaluation, a pre-check, a retry or an export returns `202` with the job or export and a `Location` header. Progress arrives on `GET /events` and can always be read from `GET /jobs/{jobId}`.

    **Lists.** `limit` (up to 500) and an opaque `cursor`. Responses are `{items, next_cursor, total}`.

    **Times and language.** RFC 3339 UTC. English only.

    **Traceability.** `x-ux` on each operation lists the requirement IDs and screens it serves, from the UX Requirements and UX Design documents.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://{host}/api/v1
  description: Backend behind the platform gateway
  variables:
    host:
      default: tender.example.org
security:
- keycloak:
  - openid
tags:
- name: Session
  description: 'The signed-in user. There is no sign-in endpoint: authentication is Keycloak (PG-01).'
- name: Users
  description: User administration (PG-07).
- name: Tenders
  description: Tenders, committees, progress and the tender home (PG-02, PG-03, PG-06, PG-08, PG-09).
- name: Documents
  description: RFP, BRD, addenda and their versions (PG-04).
- name: Viewer
  description: What the document viewer reads (PG-10 and every screen that cites evidence).
- name: Vendors
  description: Vendor profiles, proposals and conflict declarations (PG-05, PG-13).
- name: Extraction
  description: Starting requirement extraction and seeing what was extracted (PG-10).
- name: Requirements
  description: The shared requirements list (PG-11).
- name: Baseline
  description: Scoring model and the requirements baseline (PG-12).
- name: Screening
  description: Proposal screening (PG-14).
- name: Evaluation
  description: The evaluation sheet and member evaluations (PG-15, PG-16).
- name: Report
  description: The consolidated evaluation report (PG-19).
- name: Jobs
  description: The job center (PG-17).
- name: Notifications
  description: Notifications and the push stream (PG-18).
- name: Audit
  description: The audit trail and the access log (PG-20).
- name: Exports
  description: Generated files.
- name: Settings
  description: Business settings that administrators may change.
paths:
  /audit-events:
    get:
      operationId: listAuditEvents
      tags:
      - Audit
      summary: Search the audit trail
      x-roles:
      - admin
      - observer
      x-ux:
      - UX-AUD-01
      - UX-AUD-03
      - UX-AUD-04
      - PG-20
      description: 'A date range is required in practice: without from the server uses the last 30 days. The trail
        is append-only and there is no write endpoint.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: tender_id
        in: query
        description: Filter by tender.
        schema:
          type: string
          format: uuid
      - name: tender_vendor_id
        in: query
        description: Filter by vendor in a tender.
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        description: Filter by actor.
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        description: Filter by action.
        schema:
          $ref: '#/components/schemas/AuditAction'
      - name: source
        in: query
        description: Filter by source.
        schema:
          $ref: '#/components/schemas/AuditSource'
      - name: from
        in: query
        description: Start of the period.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: End of the period.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '400':
          $ref: '#/components/responses/BadRequest'
  /audit-events/export:
    post:
      operationId: exportAuditEvents
      tags:
      - Audit
      summary: Export the filtered trail as CSV
      x-roles:
      - admin
      - observer
      x-ux:
      - UX-AUD-03
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          headers:
            Location:
              description: Where to follow the job.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /categories:
    get:
      operationId: listCategories
      tags:
      - Requirements
      summary: List categories
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-REQ-04
      parameters:
      - name: include_inactive
        in: query
        description: Include deactivated categories.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCategory
      tags:
      - Requirements
      summary: Add a category
      x-roles:
      - admin
      x-ux:
      - UX-REQ-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags:
      - Requirements
      summary: Rename or deactivate a category
      description: Send the name with every change; set is_active to false to deactivate. A category that is in use is deactivated, never deleted. A name that another category has answers 409.
      x-roles:
      - admin
      x-ux:
      - UX-REQ-04
      parameters:
      - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /document-access-events:
    get:
      operationId: listDocumentAccessEvents
      tags:
      - Audit
      summary: Who opened which proposal
      x-roles:
      - admin
      - observer
      x-ux:
      - UX-NFR-07
      - PG-20
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: tender_id
        in: query
        description: Filter by tender.
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        description: Filter by user.
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: Start of the period.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: End of the period.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /document-versions/{documentVersionId}:
    get:
      operationId: getDocumentVersion
      tags:
      - Documents
      summary: Get a document version
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-03
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/impact:
    get:
      operationId: getDocumentImpact
      tags:
      - Documents
      summary: Impact of a new version on extracted requirements
      x-roles:
      - admin
      x-ux:
      - UX-DOC-04
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentImpact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/impact-decision:
    post:
      operationId: decideDocumentImpact
      tags:
      - Documents
      summary: Keep requirements or ask for re-extraction
      x-roles:
      - admin
      x-ux:
      - UX-DOC-04
      description: re_extract notifies the committee with a document_added notification.
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpactDecision'
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /document-versions/{documentVersionId}/outline:
    get:
      operationId: getDocumentOutline
      tags:
      - Viewer
      summary: Contents outline
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-06
      - UX-EXT-02
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/pages:
    get:
      operationId: listDocumentPages
      tags:
      - Viewer
      summary: Page sizes
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-06
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/passages:
    get:
      operationId: listPassages
      tags:
      - Viewer
      summary: Passages with their rectangles
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-06
      - UX-GEN-03
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      - name: page_from
        in: query
        description: First page.
        schema:
          type: integer
      - name: page_to
        in: query
        description: Last page.
        schema:
          type: integer
      - name: ids
        in: query
        description: Specific passage ids, for example the ones a citation names.
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/render:
    get:
      operationId: streamDocument
      tags:
      - Viewer
      summary: Stream the document for the viewer
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-06
      - UX-NFR-07
      - PG-10
      description: Returns the PDF (a DOCX is served as the PDF made when it was processed) inline, with Range support
        and Cache-Control no-store. There is no download endpoint for members. Each first open per session is written
        to the access log.
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      - name: Range
        in: header
        schema:
          type: string
        description: Byte range, so the viewer can open page 200 of a 300-page file without loading it all.
      responses:
        '200':
          description: The document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '206':
          description: A byte range of the document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-versions/{documentVersionId}/retry:
    post:
      operationId: retryDocumentProcessing
      tags:
      - Documents
      summary: Retry processing
      x-roles:
      - admin
      x-ux:
      - UX-DOC-03
      - UX-JOB-05
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            Location:
              description: Where to follow the job.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /document-versions/{documentVersionId}/search:
    get:
      operationId: searchDocument
      tags:
      - Viewer
      summary: Search within the document
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-06
      parameters:
      - $ref: '#/components/parameters/documentVersionId'
      - name: q
        in: query
        description: Search text.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
  /documents/{documentId}:
    get:
      operationId: getDocument
      tags:
      - Documents
      summary: Get a document with its versions
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-DOC-04
      parameters:
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{documentId}/versions:
    post:
      operationId: uploadDocumentVersion
      tags:
      - Documents
      summary: Upload a new version
      x-roles:
      - admin
      x-ux:
      - UX-DOC-04
      - PG-04
      description: Keeps the old version. Refused with baseline_locked once the baseline is confirmed, unless the
        Chair has reopened it.
      parameters:
      - $ref: '#/components/parameters/documentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentVersionUpload'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedType'
        '429':
          $ref: '#/components/responses/TooMany'
  /events:
    get:
      operationId: streamEvents
      tags:
      - Notifications
      summary: Server-Sent Events
      x-roles:
      - any
      x-ux:
      - UX-GEN-06
      - UX-JOB-04
      - UX-NOT-02
      description: 'One long-lived stream per browser tab. Each event has an id, an event name from PushEvent.type
        and a JSON data line. The server sends a comment line every 15 seconds to keep proxies open and closes the
        stream when the access token expires. The client reconnects with a fresh token and Last-Event-ID, and the
        server replays what it still holds, so a missed push is recovered. Outside the 15-minute replay window the
        server sends a resync event instead, and the client refetches what is on screen. Use a fetch-based client,
        because the browser EventSource cannot send an Authorization header. Events are hints: the client refetches
        the object they name.'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: The id of the last event the client received.
      - name: tender_id
        in: query
        description: Only events of this tender.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'An event stream. Each event is framed as "id: 42", "event: job.updated" and "data: {...}";
            the schema below describes one data line.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PushEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooMany'
  /exports/{exportId}:
    get:
      operationId: getExport
      tags:
      - Exports
      summary: Follow an export
      x-roles:
      - any
      x-ux:
      - UX-REQ-15
      - UX-RPT-09
      - UX-AUD-03
      description: Only the requester, and the roles the export type allows, can read it.
      parameters:
      - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exports/{exportId}/file:
    get:
      operationId: downloadExport
      tags:
      - Exports
      summary: Download the generated file
      x-roles:
      - any
      x-ux:
      - UX-RPT-09
      description: 409 export_not_ready until the status is ready. Report exports state the committee, baseline
        version, scoring model, AI model version and finalization date (UX-RPT-09).
      parameters:
      - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: The file as an attachment.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs:
    get:
      operationId: listJobs
      tags:
      - Jobs
      summary: Job center
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-JOB-01
      - UX-JOB-07
      - PG-17
      description: Jobs of the tenders the caller may see. Every committee member sees the same jobs.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: tender_id
        in: query
        description: Filter by tender.
        schema:
          type: string
          format: uuid
      - name: job_type
        in: query
        description: Filter by type.
        schema:
          $ref: '#/components/schemas/JobType'
      - name: status
        in: query
        description: Filter by status.
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: active
        in: query
        description: Only queued and running jobs.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags:
      - Jobs
      summary: Get a job
      x-roles:
      - admin
      - chair
      - member
      - observer
      x-ux:
      - UX-JOB-02
      - UX-JOB-03
      - UX-JOB-05
      parameters:
      - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
