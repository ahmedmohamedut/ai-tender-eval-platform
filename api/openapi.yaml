      - Vendors
      summary: Check for similar vendors
      x-roles:
      - admin
      x-ux:
      - UX-VND-02
      parameters:
      - name: name
        in: query
        description: Vendor name.
        schema:
          type: string
      - name: website
        in: query
        description: Vendor website.
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /vendors/{vendorId}:
    get:
      operationId: getVendor
      tags:
      - Vendors
      summary: Get a vendor
      x-roles:
      - admin
      x-ux:
      - UX-VND-01
      parameters:
      - $ref: '#/components/parameters/vendorId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
          headers:
            ETag:
              description: The row_version as a strong ETag.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateVendor
      tags:
      - Vendors
      summary: Edit a vendor
      x-roles:
      - admin
      x-ux:
      - UX-VND-01
      parameters:
      - $ref: '#/components/parameters/vendorId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: https://sso.example.org/realms/tender-eval/.well-known/openid-configuration
      description: Keycloak realm tender-eval. The SPA uses the authorization code flow with PKCE (client tender-spa).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size. Up to 500, so one call can load a whole evaluation sheet.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Comma-separated fields, a leading minus sorts descending, for example name,-last_activity_at.
      schema:
        type: string
    Q:
      name: q
      in: query
      description: Free-text search.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: The row_version the editor loaded, as a strong ETag, for example "12". A save that names an old
        version is refused with 412 and the current row (UX-REQ-12).
      schema:
        type: string
      required: true
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A client-generated key. A repeat of the same request with the same key returns the first result
        instead of creating another job or export.
      schema:
        type: string
    tenderId:
      name: tenderId
      in: path
      description: tenderId.
      schema:
        type: string
        format: uuid
      required: true
    documentId:
      name: documentId
      in: path
      description: documentId.
      schema:
        type: string
        format: uuid
      required: true
    documentVersionId:
      name: documentVersionId
      in: path
      description: documentVersionId.
      schema:
        type: string
        format: uuid
      required: true
    vendorId:
      name: vendorId
      in: path
      description: vendorId.
      schema:
        type: string
        format: uuid
      required: true
    tenderVendorId:
      name: tenderVendorId
      in: path
      description: tenderVendorId.
      schema:
        type: string
        format: uuid
      required: true
    userId:
      name: userId
      in: path
      description: userId.
      schema:
        type: string
        format: uuid
      required: true
    requirementId:
      name: requirementId
      in: path
      description: requirementId.
      schema:
        type: string
        format: uuid
      required: true
    jobId:
      name: jobId
      in: path
      description: jobId.
      schema:
        type: string
        format: uuid
      required: true
    memberEvaluationId:
      name: memberEvaluationId
      in: path
      description: memberEvaluationId.
      schema:
        type: string
        format: uuid
      required: true
    notificationId:
      name: notificationId
      in: path
      description: notificationId.
      schema:
        type: string
        format: uuid
      required: true
    exportId:
      name: exportId
      in: path
      description: exportId.
      schema:
        type: string
        format: uuid
      required: true
    categoryId:
      name: categoryId
      in: path
      description: categoryId.
      schema:
        type: string
        format: uuid
      required: true
    passageId:
      name: passageId
      in: path
      description: passageId.
      schema:
        type: string
        format: uuid
      required: true
    flagId:
      name: flagId
      in: path
      description: flagId.
      schema:
        type: string
        format: uuid
      required: true
    versionNo:
      name: versionNo
      in: path
      description: Version number, starting at 1.
      schema:
        type: integer
      required: true
    ReportVersionNo:
      name: version
      in: query
      description: Report version number. Defaults to the version the caller may read.
      schema:
        type: integer
  responses:
    BadRequest:
      description: The request could not be read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller may not do this. When the caller has no access to the tender, access_contacts names
        who to ask (UX-ROL-04).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such object, or none the caller may know about.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state, for example job_overlap, duplicate_vendor or baseline_locked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match named an old row_version. The body carries the current row and who changed it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblem'
    PreconditionRequired:
      description: If-Match is required on this request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooLarge:
      description: The file is larger than the upload limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedType:
      description: Only PDF and DOCX files are accepted (UX-DOC-01).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed. errors names the fields, and failures lists what must be fixed first (for
        example the pre-check list).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Rate limit reached. Retry-After says when to try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UserRole:
      type: string
      enum:
      - admin
      - member
      - observer
      description: 'Platform role. Chair is not a role: it is a flag on a tender membership.'
    UserStatus:
      type: string
      enum:
      - invited
      - active
      - deactivated
    TenderStatus:
      type: string
      enum:
      - draft
      - requirements
      - evaluation
      - consolidation
      - finalized
    Stage:
      type: string
      enum:
      - requirements
      - evaluation
      - consolidation
    DocType:
      type: string
      enum:
      - rfp
      - brd
      - addendum
      - other
      - proposal
    DocumentStatus:
      type: string
      enum:
      - uploading
      - processing
      - ready
      - failed
    FailureReason:
      type: string
      enum:
      - password_protected
      - no_selectable_text
      - unsupported_format
      - source_unavailable
      - index_unavailable
      - timeout
      - other
    ProposalStatus:
      type: string
      enum:
      - uploaded
      - in_screening
      - accepted
      - rejected
      - resubmission_requested
      - evaluating
      - evaluated
      - superseded
    FileRole:
      type: string
      enum:
      - main
      - annex
    Importance:
      type: string
      enum:
      - mandatory
      - optional
    RequirementOrigin:
      type: string
      enum:
      - ai
      - manual
    RequirementReviewState:
      type: string
      enum:
      - unreviewed
      - reviewed
      - confirmed
    DeleteReason:
      type: string
      enum:
      - duplicate
      - out_of_scope
      - not_a_requirement
      - other
    FlagType:
      type: string
      enum:
      - possible_duplicate
      - compound
      - low_confidence
      - conflict
    BaselineStatus:
      type: string
      enum:
      - confirmed
      - reopened
      - superseded
    JobType:
      type: string
      enum:
      - document_processing
      - requirement_extraction
      - evaluation
      - screening_precheck
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - completed_with_warnings
      - failed
      - cancelled
    StepStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
    Grade:
      type: string
      enum:
      - fully_compliant
      - partially_compliant
      - non_compliant
    NonComplianceReason:
      type: string
      enum:
      - explicitly_excluded
      - not_addressed
    AiOutcome:
      type: string
      enum:
      - graded
      - failed
    MemberEvaluationStatus:
      type: string
      enum:
      - not_started
      - in_progress
      - submitted
      - reopened
      - outdated
    RowReviewState:
      type: string
      enum:
      - not_reviewed
      - agreed
      - overridden
    OutdatedReason:
      type: string
      enum:
      - baseline_changed
      - proposal_changed
    RowFlag:
      type: string
      enum:
      - needs_clarification
      - outdated
      - not_evaluated
      - overridden
      - low_confidence
    ReportStatus:
      type: string
      enum:
      - in_progress
      - finalized
      - superseded
    GradeBasis:
      type: string
      enum:
      - all_agree
      - chair_decision
    VendorOutcome:
      type: string
      enum:
      - evaluated
      - rejected_at_screening
    ExportType:
      type: string
      enum:
      - report
      - requirements_list
      - clarification_list
      - audit_log
    ExportFormat:
      type: string
      enum:
      - pdf
      - xlsx
      - csv
    ExportStatus:
      type: string
      enum:
      - pending
      - ready
      - failed
    Recommendation:
      type: string
      enum:
      - accept
      - reject
      - request_resubmission
    RemovalHandling:
      type: string
      enum:
      - kept_as_history
      - reassigned
    AuditSource:
      type: string
      enum:
      - person
      - ai
      - system
    NotificationType:
      type: string
      enum:
      - added_to_tender
      - tender_opened
      - job_completed
      - job_failed
      - requirements_confirmed
      - requirements_reopened
      - proposal_screened
      - evaluation_ready
      - evaluation_reopened
      - new_proposal_version
      - all_members_submitted
      - report_finalized
      - due_date_reminder
      - manual_reminder
      - conflict_declared
      - resubmission_requested
      - document_added
    AuditAction:
      type: string
      enum:
      - tender_created
      - tender_updated
      - tender_opened
      - tender_archived
      - committee_changed
      - user_invited
      - user_role_changed
      - user_deactivated
      - vendor_created
      - vendor_updated
      - document_uploaded
      - document_version_uploaded
      - proposal_version_uploaded
      - conflict_declared
      - requirement_created
      - requirement_edited
      - requirement_deleted
      - requirement_restored
      - requirement_merged
      - requirement_split
      - requirement_reviewed
      - requirement_flag_resolved
      - scoring_changed
      - baseline_confirmed
      - baseline_reopened
      - screening_recommended
      - screening_decided
      - screening_reinstated
      - grade_agreed
      - grade_overridden
      - row_flagged
      - rows_marked_outdated
      - evaluation_submitted
      - evaluation_reopened
      - member_excluded
      - report_grade_recorded
      - report_finalized
      - report_reopened
      - export_created
      - reminders_sent
      - ai_run_completed
      - job_status_changed
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    PrecheckFailure:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        object_type:
          type:
          - string
          - 'null'
        object_ids:
          type: array
          items:
            type: string
            format: uuid
        link:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      description: One reason an action is not available yet, with a link to the objects to fix.
    AccessContact:
      type: object
      properties:
        name:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        role:
          type: string
      required:
      - name
      - role
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/PrecheckFailure'
        access_contacts:
          type: array
          items:
            $ref: '#/components/schemas/AccessContact'
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 problem details. code is a stable machine-readable value such as note_too_short.
    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - id
      - display_name
    ActionState:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type:
          - string
          - 'null'
      required:
      - allowed
      description: allowed false with a reason makes the control disabled with a one-line reason (UX-ROL-03). An
        action that is never available to the caller is omitted.
    Actions:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ActionState'
      description: Map from action name to its state.
    ConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          current:
            type: object
            additionalProperties: true
          changed_by:
            oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          changed_at:
            type:
            - string
            - 'null'
            format: date-time
          changed_fields:
            type: array
            items:
              type: string
      description: Returned on 412 when If-Match names an old row_version. current is the representation as it stands
        now.
    NoteBody:
      type: object
      properties:
        note:
          type: string
      required:
      - note
      description: A justification note. Its minimum length is in /me client_config.min_note_length.
    Scope:
      type: object
      properties:
        document_version_id:
          type: string
          format: uuid
        section_ids:
          type: array
          items:
            type: string
            format: uuid
        page_from:
          type:
          - integer
          - 'null'
        page_to:
          type:
          - integer
          - 'null'
      required:
      - document_version_id
    ClientConfig:
      type: object
      properties:
        min_note_length:
          type: integer
        upload_max_bytes:
          type: integer
        accepted_formats:
          type: array
          items:
            type: string
        low_confidence_threshold:
          type:
          - number
          - 'null'
        session_idle_timeout_seconds:
          type: integer
        session_warning_seconds:
          type: integer
      required:
      - min_note_length
      - upload_max_bytes
      - accepted_formats
      - session_idle_timeout_seconds
      - session_warning_seconds
      description: Values the SPA needs at start. The idle timeout is read from the Keycloak realm; the warning
        lead time is the setting session.warning_seconds (UX-AUTH-04).
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        time_zone:
          type:
          - string
          - 'null'
        last_sign_in_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        row_version:
          type: integer
      required:
      - id
      - email
      - display_name
      - role
      - status
      - created_at
      - row_version
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        assigned_tender_count:
          type: integer
        client_config:
          $ref: '#/components/schemas/ClientConfig'
      required:
      - user
      - assigned_tender_count
      - client_config
    MeUpdate:
      type: object
      properties:
        time_zone:
          type: string
    UserInvite:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - email
      - display_name
      - role
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    DeactivateUser:
      type: object
      properties:
        handling:
          $ref: '#/components/schemas/RemovalHandling'
        reassign_to_user_id:
          type:
          - string
          - 'null'
          format: uuid
        note:
          type:
          - string
          - 'null'
      required:
      - handling
      description: 'What happens to work in progress: keep it as read-only history, or reassign it (UX-ROL-05).'
    StageDate:
      type: object
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        due_date:
          type: string
          format: date
        reminder_lead_days:
          type:
          - integer
          - 'null'
      required:
      - stage
      - due_date
    Member:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        email:
          type: string
          format: email
        is_chair:
          type: boolean
        status:
          type: string
        added_at:
          type: string
          format: date-time
      required:
      - user
      - is_chair
      - status
    PendingTask:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required:
      - label
      - count
    NextStep:
      type: object
      properties:
        text:
          type: string
        target:
          type:
          - string
          - 'null'
        action:
