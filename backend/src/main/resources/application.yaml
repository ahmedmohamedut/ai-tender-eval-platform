# Every key without a default is required: an unset environment variable stops the
# application at start (PI 7.1). Names follow PI 7.3.
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: tender-backend
  webflux:
    base-path: /api/v1
  r2dbc:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:1}
      max-size: ${DB_POOL_MAX_SIZE:20}
  flyway:
    # Migrations run as the owner role over JDBC; the application never owns a table.
    url: ${DB_MIGRATION_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,r2dbc,nats

app:
  public-base-url: ${PUBLIC_BASE_URL}
  keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI}
  keycloak-jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  keycloak-audience: ${KEYCLOAK_AUDIENCE:tender-api}
  spa-client-id: ${SPA_CLIENT_ID:tender-spa}
  nats-url: ${NATS_URL}
  dev-endpoints: ${APP_DEV_ENDPOINTS:false}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  user-status-cache-seconds: ${USER_STATUS_CACHE_SECONDS:30}
  session-idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT_SECONDS:1800}
  keycloak-admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL}
  keycloak-admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:tender-backend-admin}
  keycloak-admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  invitation-lifespan-seconds: ${KEYCLOAK_INVITATION_LIFESPAN_SECONDS:259200}
  s3-endpoint: ${S3_ENDPOINT}
  s3-region: ${S3_REGION:us-east-1}
  s3-path-style: ${S3_PATH_STYLE:true}
  s3-access-key: ${S3_ACCESS_KEY}
  s3-secret-key: ${S3_SECRET_KEY}
  s3-bucket-documents: ${S3_BUCKET_DOCUMENTS:tender-documents}
  s3-bucket-derived: ${S3_BUCKET_DERIVED:tender-derived}
  s3-multipart-part-mb: ${S3_MULTIPART_PART_MB:8}
  db-ingest-username: ${DB_INGEST_USERNAME}
  db-ingest-password: ${DB_INGEST_PASSWORD}
  db-ingest-pool-max-size: ${DB_INGEST_POOL_MAX_SIZE:8}
  watchdog-queued-timeout-seconds: ${WATCHDOG_QUEUED_TIMEOUT_SECONDS:120}
  watchdog-silence-timeout-seconds: ${WATCHDOG_SILENCE_TIMEOUT_SECONDS:300}
  job-max-minutes-document-processing: ${JOB_MAX_DURATION_MINUTES_DOCUMENT_PROCESSING:30}
  job-max-minutes-requirement-extraction: ${JOB_MAX_DURATION_MINUTES_REQUIREMENT_EXTRACTION:60}
  job-max-minutes-screening-precheck: ${JOB_MAX_DURATION_MINUTES_SCREENING_PRECHECK:30}
  job-max-minutes-evaluation: ${JOB_MAX_DURATION_MINUTES_EVALUATION:360}
  watchdog-enabled: ${WATCHDOG_ENABLED:true}
  watchdog-interval-seconds: ${WATCHDOG_INTERVAL_SECONDS:30}
  rate-limit-uploads-per-minute: ${RATE_LIMIT_UPLOADS_PER_MINUTE:10}
  rate-limit-search-per-minute: ${RATE_LIMIT_SEARCH_PER_MINUTE:120}
  rate-limit-job-starts-per-minute: ${RATE_LIMIT_JOB_STARTS_PER_MINUTE:20}
  rate-limit-exports-per-minute: ${RATE_LIMIT_EXPORTS_PER_MINUTE:10}

logging:
  level:
    root: ${LOG_LEVEL:info}
